<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>Private Chat</title>
    <link rel="stylesheet" href="/static/css/variables.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <style>
    /* --- RESET & BASICS --- */

    /* --- LOGIN SCREEN --- */
    .overlay { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: #121212; 
        display: flex; flex-direction: column; justify-content: center; align-items: center; 
        z-index: 1000; padding: 20px;
    }


    /* --- MAIN LAYOUT --- */

    /* --- HEADERS & TABS --- */
    
    /* Search */
    #search-container { padding: 10px; background: #1e1e1e; }
    #search-input { width: 100%; padding: 10px; background: #2a2a2a; border: none; border-radius: 8px; color: white; outline: none; }

    /* --- LIST & ITEMS --- */
    

    /* Avatars */
    

    /* --- CHAT MESSAGES --- */
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 75%; padding: 12px 18px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .msg.me { align-self: flex-end; background: linear-gradient(135deg, #0084ff, #0055ff); color: white; border-bottom-right-radius: 4px; }
    .msg.me .sender-name { display: none; }
    .msg.friend { align-self: flex-start; background-color: #262626; color: #e4e6eb; border-bottom-left-radius: 4px; }
    .msg.friend .sender-name { font-size: 11px; opacity: 0.7; margin-bottom: 4px; display: block; color: #bbb; }


    /* --- INPUT AREA --- */
    .input-area { padding: 8px; background: #1e1e1e; display: flex; gap: 5px; align-items: center; border-top: 1px solid #2a2a2a; width: 100%; box-sizing: border-box;}
    .input-area input { flex: 1; min-width: 0; width: 100%; padding: 10px; border-radius: 20px; border: none; background: #2a2a2a; color: white; font-size: 16px; outline: none; }
    #send-btn { width: 40px; height: 40px; border-radius: 50%; background: #0084ff; color: white; border: none; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;  cursor: pointer;}
    #send-btn:disabled { background: #444; cursor: not-allowed; }

    /* --- TOASTS --- */
    #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }


    /* --- MOBILE RESPONSIVE LOGIC --- */
    @media (max-width: 768px) {
        /* Force Absolute Positioning */
        .sidebar { width: 100%; height: 100%; position: absolute; top: 0; left: 0; transition: transform 0.3s ease; }
        .chat-area { width: 100%; height: 100dvh; bottom: 0; position: absolute; top: 0; left: 0; }

        /* Toggle Visibility */
        body.view-list .sidebar { transform: translateX(0); z-index: 50; }
        body.view-list .chat-area { z-index: 0; }

        body.view-chat .sidebar { transform: translateX(-100%); }
        body.view-chat .chat-area { z-index: 50; }

        .icon-btn { width: 35px; height: 35px; font-size: 18px; }

        /* Notch / Safe Area Fixes */
        .sidebar-header { padding-top: 50px !important; }
        .chat-header { padding-top: 50px !important; height: 90px !important; align-items: flex-end !important; padding-bottom: 10px !important; }

        /* Back Button */
        #back-btn { display: block !important; font-size: 24px; background: none; border: none; color: white; padding-right: 15px; }
    }

    @media (min-width: 769px) { #back-btn { display: none; } }

    /* --- 1. NEW: Typing Indicator Style (Floating) --- */
    .typing-indicator {
        position: absolute;
        bottom: 70px; /* Sits exactly above the input bar */
        left: 20px;
        z-index: 100;
        
        /* Glassmorphism Look */
        background: rgba(0, 0, 0, 0.6);
        color: #0084ff;
        padding: 5px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        pointer-events: none; /* Let clicks pass through it */
        display: none; /* Hidden by default */
        backdrop-filter: blur(4px);
    }

    /* --- 2. FIX: Force Mobile Header Left --- */
    @media (max-width: 768px) {
        .chat-header {
            /* Override the 'flex-end' that was pushing it to the right */
            align-items: center !important; 
            justify-content: flex-start !important; /* Force Left */
            padding-bottom: 10px !important;
            padding-left: 15px !important;
            gap: 15px !important;
        }
        
        /* Fix Back Button Alignment */
        #back-btn {
            margin-right: 5px;
            padding: 0;
            display: flex;
            align-items: center;
        }
    }
</style>

</head>
<body>

<div id="toast-container"></div>

<div id="login-screen" class="overlay">
    <div class="box">
        <h2 id="form-title" style="text-align: center; margin: 0;">Login</h2>
        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">
        <button id="auth-btn" onclick="handleAuth()">Login</button>
        <div class="link" onclick="toggleMode()" id="toggle-text">Need an account? Register</div>
    </div>
</div>

<div id="app-container" class="view-list"> 
    
    <div class="sidebar">
        <div class="sidebar-header" style="flex-direction: column; height: auto; gap: 0;">
            
            <div style="width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a;">
                <span style="font-weight:bold; font-size: 18px;">Private Chat</span>
                <button onclick="logout()" style="padding: 6px 12px; font-size: 11px; background: #d9534f; border-radius: 4px;">Logout</button>
            </div>

            <div style="display: flex; width: 100%; background: #1a1a1a;">
                <div id="tab-chats" class="tab-btn active" onclick="switchTab('chats')">Chats</div>
                <div id="tab-people" class="tab-btn" onclick="switchTab('people')">People</div>
            </div>

            <div id="search-container" style="width: 100%; padding: 10px; display: none;">
                <input id="search-input" placeholder="Find users..." onkeyup="handleSearch(event)">
            </div>
        </div>

        <div id="list-area" class="list-area"></div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <button id="back-btn" onclick="showListView()">&#8592;</button>
            <div style="display:flex; flex-direction:column;">
                <span id="chat-title">Select a Chat</span>
                <div style="display:flex; gap: 5px; align-items:center;">
                    <span id="chat-status" style="font-size: 12px; font-weight: normal; color: #888;"></span>
                    <span id="typing-indicator" style="font-size: 11px; color: #007bff; font-weight: bold; display: none;">typing...</span>
                </div>
            </div>
        </div>
        
        <div id="messages" class="messages">
            <div style="height: 100%; display: flex; align-items: center; justify-content: center; color: #333; flex-direction: column;">
                <div style="font-size: 40px; margin-bottom: 10px;">💬</div>
                <div>Select a contact to start chatting</div>
            </div>
        </div>

        <div id="typing-indicator" style="display: none; color: #0084ff; font-size: 12px; padding: 5px 15px; font-style: italic;">
            Someone is typing...
        </div>

        <div class="input-area">
            <input type="file" id="input-gallery" style="display: none;" accept="image/*" onchange="handleFileUpload(this)">
            <input type="file" id="input-camera" style="display: none;" accept="image/*" capture="environment" onchange="handleFileUpload(this)">
            
            <button class="icon-btn" id="emoji-btn">🙂</button>

            <input id="msg-input" placeholder="Message..." disabled onkeypress="handleEnter(event)" oninput="handleInput()">

            <button class="icon-btn" onclick="document.getElementById('input-gallery').click()">📎</button>
            <button class="icon-btn" onclick="document.getElementById('input-camera').click()">📷</button>
            
            
            <button id="send-btn" onclick="send()" disabled>&#10148;</button>
        </div>
    </div>
</div>

<script src="/static/js/core.js"></script>
<script src="/static/js/utils.js"></script>
<script src="/static/js/sidebar.js"></script>
<script src="/static/js/auth.js"></script>
<script src="/static/js/websocket.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/upload.js"></script>
<script>
    let token = null;
    let currentUser = null;
    let currentFriend = null;
    let ws = null;
    let shouldReconnectWs = false;
    let reconnectTimer = null;
    let presenceRefreshTimer = null;
    let isRegisterMode = false;
    let currentTab = 'chats';

// --- UI HELPERS ---

    function showChatView() {
        document.body.classList.add("view-chat");
        document.body.classList.remove("view-list");
    }

    function showListView() {
        document.body.classList.add("view-list");
        document.body.classList.remove("view-chat");
        // Optional: Close WS to save battery/data if desired? For now, keep open.
    }

    // --- UTILS ---

    // --- CHAT ---



</script>
<script type="module">
    // 1. Import the library directly from the web
    import { EmojiButton } from 'https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@4.6.4/dist/index.min.js';

    // 2. Initialize Logic
    window.addEventListener('DOMContentLoaded', () => {
        const picker = new EmojiButton({
            position: 'top-start',
            theme: 'dark',
            autoHide: false 
        });

        const trigger = document.getElementById('emoji-btn');
        const input = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');

        if (trigger && input) {
            trigger.addEventListener('click', () => {
                picker.togglePicker(trigger);
            });

            picker.on('emoji', selection => {
                input.value += selection.emoji;
                // Enable send button since we added text
                if(sendBtn) sendBtn.disabled = false;
                input.focus();
            });
        }
    });
</script>
</body>
</html>
