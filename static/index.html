<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>Private Chat</title>
    <link rel="stylesheet" href="/static/css/base.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <style>
    /* --- RESET & BASICS --- */

    /* --- LOGIN SCREEN --- */
    .overlay { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background: #121212; 
        display: flex; flex-direction: column; justify-content: center; align-items: center; 
        z-index: 1000; padding: 20px;
    }


    /* --- MAIN LAYOUT --- */

    /* --- HEADERS & TABS --- */
    
    /* Search */
    #search-container { padding: 10px; background: #1e1e1e; }
    #search-input { width: 100%; padding: 10px; background: #2a2a2a; border: none; border-radius: 8px; color: white; outline: none; }

    /* --- LIST & ITEMS --- */
    

    /* Avatars */
    

    /* --- CHAT MESSAGES --- */
    .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 75%; padding: 12px 18px; border-radius: 18px; font-size: 15px; line-height: 1.4; word-wrap: break-word; }
    .msg.me { align-self: flex-end; background: linear-gradient(135deg, #0084ff, #0055ff); color: white; border-bottom-right-radius: 4px; }
    .msg.me .sender-name { display: none; }
    .msg.friend { align-self: flex-start; background-color: #262626; color: #e4e6eb; border-bottom-left-radius: 4px; }
    .msg.friend .sender-name { font-size: 11px; opacity: 0.7; margin-bottom: 4px; display: block; color: #bbb; }


    /* --- INPUT AREA --- */
    .input-area { padding: 8px; background: #1e1e1e; display: flex; gap: 5px; align-items: center; border-top: 1px solid #2a2a2a; width: 100%; box-sizing: border-box;}
    .input-area input { flex: 1; min-width: 0; width: 100%; padding: 10px; border-radius: 20px; border: none; background: #2a2a2a; color: white; font-size: 16px; outline: none; }
    #send-btn { width: 40px; height: 40px; border-radius: 50%; background: #0084ff; color: white; border: none; font-size: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;  cursor: pointer;}
    #send-btn:disabled { background: #444; cursor: not-allowed; }

    /* --- TOASTS --- */
    #toast-container { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 2000; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }


    /* --- MOBILE RESPONSIVE LOGIC --- */
    @media (max-width: 768px) {
        /* Force Absolute Positioning */
        .sidebar { width: 100%; height: 100%; position: absolute; top: 0; left: 0; transition: transform 0.3s ease; }
        .chat-area { width: 100%; height: 100dvh; bottom: 0; position: absolute; top: 0; left: 0; }

        /* Toggle Visibility */
        body.view-list .sidebar { transform: translateX(0); z-index: 50; }
        body.view-list .chat-area { z-index: 0; }

        body.view-chat .sidebar { transform: translateX(-100%); }
        body.view-chat .chat-area { z-index: 50; }

        .icon-btn { width: 35px; height: 35px; font-size: 18px; }

        /* Notch / Safe Area Fixes */
        .sidebar-header { padding-top: 50px !important; }
        .chat-header { padding-top: 50px !important; height: 90px !important; align-items: flex-end !important; padding-bottom: 10px !important; }

        /* Back Button */
        #back-btn { display: block !important; font-size: 24px; background: none; border: none; color: white; padding-right: 15px; }
    }

    @media (min-width: 769px) { #back-btn { display: none; } }

    /* --- 1. NEW: Typing Indicator Style (Floating) --- */
    .typing-indicator {
        position: absolute;
        bottom: 70px; /* Sits exactly above the input bar */
        left: 20px;
        z-index: 100;
        
        /* Glassmorphism Look */
        background: rgba(0, 0, 0, 0.6);
        color: #0084ff;
        padding: 5px 12px;
        border-radius: 12px;
        font-size: 12px;
        font-weight: 600;
        pointer-events: none; /* Let clicks pass through it */
        display: none; /* Hidden by default */
        backdrop-filter: blur(4px);
    }

    /* --- 2. FIX: Force Mobile Header Left --- */
    @media (max-width: 768px) {
        .chat-header {
            /* Override the 'flex-end' that was pushing it to the right */
            align-items: center !important; 
            justify-content: flex-start !important; /* Force Left */
            padding-bottom: 10px !important;
            padding-left: 15px !important;
            gap: 15px !important;
        }
        
        /* Fix Back Button Alignment */
        #back-btn {
            margin-right: 5px;
            padding: 0;
            display: flex;
            align-items: center;
        }
    }
</style>

</head>
<body>

<div id="toast-container"></div>

<div id="login-screen" class="overlay">
    <div class="box">
        <h2 id="form-title" style="text-align: center; margin: 0;">Login</h2>
        <input id="username" placeholder="Username">
        <input id="password" type="password" placeholder="Password">
        <button id="auth-btn" onclick="handleAuth()">Login</button>
        <div class="link" onclick="toggleMode()" id="toggle-text">Need an account? Register</div>
    </div>
</div>

<div id="app-container" class="view-list"> 
    
    <div class="sidebar">
        <div class="sidebar-header" style="flex-direction: column; height: auto; gap: 0;">
            
            <div style="width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a;">
                <span style="font-weight:bold; font-size: 18px;">Private Chat</span>
                <button onclick="logout()" style="padding: 6px 12px; font-size: 11px; background: #d9534f; border-radius: 4px;">Logout</button>
            </div>

            <div style="display: flex; width: 100%; background: #1a1a1a;">
                <div id="tab-chats" class="tab-btn active" onclick="switchTab('chats')">Chats</div>
                <div id="tab-people" class="tab-btn" onclick="switchTab('people')">People</div>
            </div>

            <div id="search-container" style="width: 100%; padding: 10px; display: none;">
                <input id="search-input" placeholder="Find users..." onkeyup="handleSearch(event)">
            </div>
        </div>

        <div id="list-area" class="list-area"></div>
    </div>

    <div class="chat-area">
        <div class="chat-header">
            <button id="back-btn" onclick="showListView()">&#8592;</button>
            <div style="display:flex; flex-direction:column;">
                <span id="chat-title">Select a Chat</span>
                <div style="display:flex; gap: 5px; align-items:center;">
                    <span id="chat-status" style="font-size: 12px; font-weight: normal; color: #888;"></span>
                    <span id="typing-indicator" style="font-size: 11px; color: #007bff; font-weight: bold; display: none;">typing...</span>
                </div>
            </div>
        </div>
        
        <div id="messages" class="messages">
            <div style="height: 100%; display: flex; align-items: center; justify-content: center; color: #333; flex-direction: column;">
                <div style="font-size: 40px; margin-bottom: 10px;">💬</div>
                <div>Select a contact to start chatting</div>
            </div>
        </div>

        <div id="typing-indicator" style="display: none; color: #0084ff; font-size: 12px; padding: 5px 15px; font-style: italic;">
            Someone is typing...
        </div>

        <div class="input-area">
            <input type="file" id="input-gallery" style="display: none;" accept="image/*" onchange="handleFileUpload(this)">
            <input type="file" id="input-camera" style="display: none;" accept="image/*" capture="environment" onchange="handleFileUpload(this)">
            
            <button class="icon-btn" id="emoji-btn">🙂</button>

            <input id="msg-input" placeholder="Message..." disabled onkeypress="handleEnter(event)" oninput="handleInput()">

            <button class="icon-btn" onclick="document.getElementById('input-gallery').click()">📎</button>
            <button class="icon-btn" onclick="document.getElementById('input-camera').click()">📷</button>
            
            
            <button id="send-btn" onclick="send()" disabled>&#10148;</button>
        </div>
    </div>
</div>

<script>
    let token = null;
    let currentUser = null;
    let currentFriend = null;
    let ws = null;
    let shouldReconnectWs = false;
    let reconnectTimer = null;
    let presenceRefreshTimer = null;
    let isRegisterMode = false;
    let currentTab = 'chats';

    function connectWebSocket() {
        if (!token) return;

        if (reconnectTimer) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
        }

        if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) {
            return;
        }

        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = new WebSocket(`${protocol}//${window.location.host}/ws?token=${token}`);

        ws.onopen = () => {
            if (currentFriend) {
                sendSocketPayload({ type: "join", room: currentFriend });
            }
        };

        ws.onmessage = handleSocketMessage;

        ws.onclose = () => {
            ws = null;
            if (shouldReconnectWs && token) {
                reconnectTimer = setTimeout(connectWebSocket, 3000);
            }
        };

        ws.onerror = () => {
            if (ws) ws.close();
        };
    }

    function disconnectWebSocket() {
        shouldReconnectWs = false;

        if (reconnectTimer) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
        }

        if (ws) {
            ws.onclose = null;
            ws.close();
            ws = null;
        }
    }

    function sendSocketPayload(payload) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            connectWebSocket();
            return false;
        }

        ws.send(JSON.stringify(payload));
        return true;
    }

    function handleSocketMessage(e) {
        const data = JSON.parse(e.data);

        if (data.type === "chat") {
            const indicators = document.querySelectorAll("#typing-indicator, .typing-indicator");
            indicators.forEach(ind => ind.style.display = "none");
            addMessage(data.sender, data.text, data.image_url);
        } else if (data.type === "typing") {
            if (data.sender === currentFriend) {
                const statusEl = document.getElementById("chat-status");
                statusEl.innerText = "Online";
                statusEl.className = "status online";
                statusEl.style.color = "#2ecc71";
            }

            if (typeof showTyping === "function") {
                showTyping(data.sender);
            }
        } else if (data.type === "error") {
            showToast(data.message || "Chat error", "error");
        }
    }

    function startPresenceRefresh() {
        stopPresenceRefresh();
        presenceRefreshTimer = setInterval(refreshSidebarForPresence, 15000);
    }

    function stopPresenceRefresh() {
        if (presenceRefreshTimer) {
            clearInterval(presenceRefreshTimer);
            presenceRefreshTimer = null;
        }
    }

    function refreshSidebarForPresence() {
        if (!token) return;

        const searchInput = document.getElementById("search-input");
        if (currentTab === 'people' && searchInput && searchInput.value.trim()) {
            return;
        }

        loadSidebar();
    }

    function updateChatStatus(friend) {
        if (!friend || friend.username !== currentFriend) return;

        const statusEl = document.getElementById("chat-status");
        if (friend.is_online) {
            statusEl.innerText = "Online";
            statusEl.className = "status online";
            statusEl.style.color = "#2ecc71";
        } else {
            statusEl.innerText = formatLastSeen(friend.last_seen);
            statusEl.className = "status offline";
            statusEl.style.color = "#888";
        }
    }

    // --- UI HELPERS ---
    function showToast(msg, type = "normal") {
        const container = document.getElementById("toast-container");
        const div = document.createElement("div");
        div.className = `toast ${type}`;
        div.innerText = msg;
        container.appendChild(div);
        
        // Trigger animation
        setTimeout(() => div.classList.add("show"), 10);
        setTimeout(() => {
            div.classList.remove("show");
            setTimeout(() => div.remove(), 300);
        }, 3000);
    }

    function showChatView() {
        document.body.classList.add("view-chat");
        document.body.classList.remove("view-list");
    }

    function showListView() {
        document.body.classList.add("view-list");
        document.body.classList.remove("view-chat");
        // Optional: Close WS to save battery/data if desired? For now, keep open.
    }

    function logout() {
        // 1. Close session-level work
        disconnectWebSocket();
        stopPresenceRefresh();

        // 2. Destroy Session Data
        token = null;
        currentUser = null;
        currentFriend = null;
        currentTab = 'chats'; // Reset tab

        // 3. 🚨 SECURITY WIPE: Clear sensitive HTML
        document.getElementById("list-area").innerHTML = ""; // Wipe contacts
        document.getElementById("messages").innerHTML = "";  // Wipe chat history
        document.getElementById("chat-title").innerText = "Select a Chat"; // Reset Header
        document.getElementById("chat-status").innerText = ""; 
        document.getElementById("msg-input").value = "";
        
        // 4. Disable Inputs
        document.getElementById("msg-input").disabled = true;
        document.getElementById("send-btn").disabled = true;

        // 5. Restore "Empty State" / Welcome Screen
        // We inject the Welcome HTML back into the message box so the next user sees that, not a blank void
        document.getElementById("messages").innerHTML = `
            <div id="welcome-screen" style="height: 100%; display: flex; align-items: center; justify-content: center; color: #555; flex-direction: column;">
                <div style="font-size: 40px; margin-bottom: 10px; opacity:0.5;">💬</div>
                <div style="opacity:0.6;">Select a contact to start chatting securely</div>
            </div>
        `;

        // 6. Switch View
        document.getElementById("app-container").style.display = "none";
        document.getElementById("login-screen").style.display = "flex";
        
        // Clear Form
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
    }

    // --- UTILS ---
    function formatLastSeen(isoStr) {
        if (!isoStr) return "Offline";
        const date = new Date(isoStr + "Z");
        const now = new Date();
        const diffSeconds = Math.floor((now - date) / 1000);
        if (diffSeconds < 60) return "Online";
        if (diffSeconds < 3600) return `${Math.floor(diffSeconds / 60)}m ago`;
        if (diffSeconds < 86400) return `${Math.floor(diffSeconds / 3600)}h ago`;
        return `${Math.floor(diffSeconds / 86400)}d ago`;
    }

    // --- AUTH ---
    function toggleMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById("form-title").innerText = isRegisterMode ? "Create Account" : "Login";
        document.getElementById("auth-btn").innerText = isRegisterMode ? "Register" : "Login";
        document.getElementById("toggle-text").innerText = isRegisterMode ? "Have an account? Login" : "Need an account? Register";
    }

    async function handleAuth() {
        const user = document.getElementById("username").value;
        const pass = document.getElementById("password").value;
        const endpoint = isRegisterMode ? "/register" : "/login";
        const btn = document.getElementById("auth-btn");

        if(!user || !pass) return showToast("Please fill fields", "error");

        btn.innerText = "Processing...";
        btn.disabled = true;

        try {
            const res = await fetch(endpoint, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ username: user, password: pass })
            });
            const data = await res.json();
            
            if (res.ok) {
                if (isRegisterMode) {
                    showToast("Registered! Please log in.", "success");
                    toggleMode();
                } else {
                    token = data.access_token;
                    currentUser = user;
                    document.getElementById("login-screen").style.display = "none";
                    document.getElementById("app-container").style.display = "flex";
                    shouldReconnectWs = true;
                    connectWebSocket();
                    startPresenceRefresh();
                    loadSidebar();
                }
            } else {
                showToast(data.detail || "Error", "error");
            }
        } catch (e) { showToast("Server error", "error"); }
        
        btn.innerText = isRegisterMode ? "Register" : "Login";
        btn.disabled = false;
    }

    function switchTab(tabName) {
        currentTab = tabName;
        
        // Update UI Tabs
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`tab-${tabName}`).classList.add('active');

        // Show/Hide Search
        const searchBox = document.getElementById("search-container");
        if (tabName === 'people') {
            searchBox.style.display = 'block';
        } else {
            searchBox.style.display = 'none';
        }

        // Reload the list
        loadSidebar();
    }
    // --- SIDEBAR ---
    async function loadSidebar() {
        if (!token) return;

        const list = document.getElementById("list-area");
        list.innerHTML = "";

        // fetch data
        const [reqRes, friendRes] = await Promise.all([
            fetch("/friends/requests", { headers: { "Authorization": `Bearer ${token}` } }),
            fetch("/friends", { headers: { "Authorization": `Bearer ${token}` } })
        ]);

        if (!reqRes.ok || !friendRes.ok) return;

        const requests = await reqRes.json();
        const friends = await friendRes.json();
        const selectedFriend = friends.find(f => f.username === currentFriend);
        if (selectedFriend) updateChatStatus(selectedFriend);

        // === RENDER LOGIC BASED ON TAB ===
        
        if (currentTab === 'chats') {
            // -- CHATS TAB: Only show Friends (Active Chats) --
            // (Ideally, backend should sort by 'last_message_time', for now we show all friends)
            
            if (friends.length === 0) {
                list.innerHTML = "<div style='padding:20px; text-align:center; color:#555;'>No chats yet.<br>Go to 'People' to add friends!</div>";
                return;
            }

            friends.forEach(f => renderFriendItem(list, f));

        } else if (currentTab === 'people') {
            // -- PEOPLE TAB: Requests + Search Results + All Friends --
            
            // 1. Friend Requests
            if (requests.length > 0) {
                list.innerHTML += `<div class="section-title">Requests (${requests.length})</div>`;
                requests.forEach(r => {
                    const div = document.createElement("div");
                    div.className = "item";
                    div.innerHTML = `
                        <div class="avatar" style="background:#d9534f; border:none;">!</div>
                        <div class="info"><span class="name">${r.username}</span></div>
                        <button class="action-btn" onclick="acceptRequest(${r.request_id})" style="background:#28a745">Accept</button>
                    `;
                    list.appendChild(div);
                });
            }

            // 2. All Friends (Directory)
            list.innerHTML += `<div class="section-title">Your Contacts</div>`;
            friends.forEach(f => renderFriendItem(list, f));
        }
    }

    async function handleSearch(e) {
        const query = e.target.value;
        if (!query) return loadSidebar(); 

        const res = await fetch(`/search?query=${query}`, { headers: { "Authorization": `Bearer ${token}` } });
        const results = await res.json();
        const list = document.getElementById("list-area");
        list.innerHTML = "";
        
        if (results.length === 0) list.innerHTML = "<div style='padding:20px;text-align:center;color:#666'>No users found</div>";

        results.forEach(item => {
            const div = document.createElement("div");
            div.className = "item";
            let action = "";

            if (item.status === "none") {
                action = `<button class="action-btn" onclick="addFriend('${item.username}')">Add</button>`;
            } else if (item.status === "pending") {
                action = `<span class="status">Sent</span>`;
            } else {
                action = `<span class="status">Friend</span>`;
            }

            div.innerHTML = `
                <div class="avatar">${item.username[0].toUpperCase()}</div>
                <div class="info"><span class="name">${item.username}</span></div>
                ${action}
            `;
            list.appendChild(div);
        });
    }

    // Helper to render a friend row
    function renderFriendItem(container, f) {
        const div = document.createElement("div");
        div.className = "item";
        if (currentTab === 'chats' && currentFriend === f.username) div.classList.add("active");

        const avatarUrl = `https://api.dicebear.com/7.x/notionists/svg?seed=${f.username}&backgroundColor=b6e3f4,c0aede,d1d4f9`;
        
        // Use Backend "is_online" truth
        const isOnline = f.is_online; 
        const seenText = isOnline ? "Online" : formatLastSeen(f.last_seen);

        div.innerHTML = `
            <div class="avatar">
                <img src="${avatarUrl}">
            </div>
            <div class="info">
                <span class="name">${f.username}</span>
                <span class="status ${isOnline ? 'online' : ''}">${seenText}</span>
            </div>
        `;
        div.onclick = () => startChat(f, div);
        container.appendChild(div);
    }

    async function addFriend(username) {
        await fetch(`/friends/request/${username}`, { method: "POST", headers: { "Authorization": `Bearer ${token}` } });
        showToast(`Request sent to ${username}`, "success");
        handleSearch({target: {value: document.getElementById("search-input").value}});
    }

    async function acceptRequest(id) {
        await fetch(`/friends/accept/${id}`, { method: "POST", headers: { "Authorization": `Bearer ${token}` } });
        showToast("Friend added!", "success");
        loadSidebar();
    }

        // --- CHAT ---
    function startChat(friend, element) {
            //console.log("Friend Object Data:", friend);
            currentFriend = friend.username;
            
            // UI Updates
            document.querySelectorAll(".item").forEach(el => el.classList.remove("active"));
            if (element) element.classList.add("active");
            
            document.getElementById("chat-title").innerText = friend.username;
            const statusEl = document.getElementById("chat-status");
            
                // ✅ Using the exact 'is_online' property from your database/server
            if (friend.is_online) {
                statusEl.innerText = "Online";
                statusEl.className = "status online";
                statusEl.style.color = "#2ecc71"; // Green
            } else {
                statusEl.innerText = formatLastSeen(friend.last_seen);
                statusEl.className = "status offline";
                statusEl.style.color = "#888"; // Gray
            }
            //document.getElementById("chat-status").innerText = formatLastSeen(friend.last_seen);
            
            // 🚨 CRITICAL: Wipe the "Welcome Screen" or old messages before loading new ones
            document.getElementById("messages").innerHTML = "";
            
            document.getElementById("msg-input").disabled = false;
            document.getElementById("send-btn").disabled = false;

            connectWebSocket();
            sendSocketPayload({ type: "join", room: currentFriend });
            
                    //console.log("📥 [STEP 3] Received typing signal from:", data.sender);
                    
                    

            // Mobile Logic
            if (window.innerWidth <= 768) {
                document.body.classList.add("view-chat");
                document.body.classList.remove("view-list");
            }
    }   

    function showTyping(sender) {
        if (sender === currentUser) return;
        
        const indicator = document.getElementById("typing-indicator");
        
        if(indicator){
            indicator.innerText = `${sender} is typing...`;
            indicator.style.display = "block";
        
            // Clear old timer if exists
            if (window.typingTimeout) clearTimeout(window.typingTimeout);

            // Hide after 3 seconds of silence
            window.typingTimeout = setTimeout(() => {
                indicator.style.display = "none";
            }, 3000); // 3000ms
        } else{
            console.error("❌ [STEP 3 FAILED] Could not find #typing-indicator div in HTML");
        }
    }    

    function handleInput() {
        const input = document.getElementById("msg-input");
        const sendBtn = document.getElementById("send-btn");
        
        // 1. Enable/Disable Send Button
        sendBtn.disabled = (input.value.trim() === "");

        // 2. ✅ SEND TYPING SIGNAL
        // Only send if we have a friend selected and socket is open
        if (currentFriend) {
            console.log("📤 [STEP 1] Sending typing signal to:", currentFriend);

            sendSocketPayload({
                type: "typing",
                room: currentFriend // Tells server who to notify
            });
        } else if (ws) {
            console.warn("⚠️ [STEP 1 FAILED] Cannot send. Friend selected:", currentFriend, "WS State:", ws.readyState);
        }
    }
    function send() {
        const input = document.getElementById("msg-input");
        if (!input.value || !currentFriend) return;
        const sent = sendSocketPayload({ type: "chat", room: currentFriend, text: input.value });
        if (!sent) {
            showToast("Reconnecting chat...", "normal");
            return;
        }
        input.value = "";
    }

    function addMessage(sender, text, imageUrl) {
        const box = document.getElementById("messages");
        const isMe = sender === currentUser;

        const div = document.createElement("div");
        div.className = `msg ${isMe ? "me" : "friend"}`;
        let contentHtml = "";
        
        // 1. Show Image if exists
        if (imageUrl) {
            contentHtml += `<img src="${imageUrl}" style="max-width: 100%; border-radius: 12px; display: block; margin-bottom: 5px; cursor:pointer;" onclick="window.open(this.src)">`;
        }
        
        // 2. Show Text if exists
        if (text) {
            contentHtml += `<span>${text}</span>`;
        }
        
        // 3. Add Sender Name (Only for friend)
        let nameHtml = isMe ? "" : `<span class="sender-name">${sender}</span>`;

        div.innerHTML = nameHtml + contentHtml;
        
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    async function handleFileUpload(inputElement) {
        const file = inputElement.files[0];
        if (!file) return;
        if (!currentFriend) {
            showToast("Select a chat first", "error");
            inputElement.value = "";
            return;
        }

        const formData = new FormData();
        formData.append("file", file);

        try {
            showToast("Uploading...", "normal");
            const res = await fetch("/upload", {
                method: "POST",
                headers: { "Authorization": `Bearer ${token}` },
                body: formData
            });
            
            if (res.ok) {
                const data = await res.json();
                // Send message with Image URL
                const sent = sendSocketPayload({
                    type: "chat",
                    room: currentFriend,
                    text: "", 
                    image_url: data.url
                });
                if (!sent) {
                    showToast("Reconnecting chat...", "normal");
                }
            } else {
                showToast("Upload failed", "error");
            }
        } catch (e) {
            showToast("Error uploading", "error");
        }
        inputElement.value = ""; // Reset
    }
    function handleEnter(e) { if (e.key === "Enter") send(); }


</script>
<script type="module">
    // 1. Import the library directly from the web
    import { EmojiButton } from 'https://cdn.jsdelivr.net/npm/@joeattardi/emoji-button@4.6.4/dist/index.min.js';

    // 2. Initialize Logic
    window.addEventListener('DOMContentLoaded', () => {
        const picker = new EmojiButton({
            position: 'top-start',
            theme: 'dark',
            autoHide: false 
        });

        const trigger = document.getElementById('emoji-btn');
        const input = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');

        if (trigger && input) {
            trigger.addEventListener('click', () => {
                picker.togglePicker(trigger);
            });

            picker.on('emoji', selection => {
                input.value += selection.emoji;
                // Enable send button since we added text
                if(sendBtn) sendBtn.disabled = false;
                input.focus();
            });
        }
    });
</script>
